name: Cut release

# Owner flow (no local git): merge the version PR on main, then run this workflow
# from the Actions tab. Tags pushed by GITHUB_TOKEN do not trigger other workflows,
# so this workflow calls Release directly after pushing the tag.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver X.Y.Z (must match ambient_contracts.__version__ on main)
        required: true
        default: "0.3.8"
        type: string

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package (read __version__)
        run: pip install -e .

      - name: Verify version and CHANGELOG
        env:
          WANT: ${{ inputs.version }}
        run: |
          PKG="$(python -c "import ambient_contracts; print(ambient_contracts.__version__)")"
          if [ "$WANT" != "$PKG" ]; then
            echo "Input version $WANT does not match ambient_contracts.__version__ ($PKG)" >&2
            exit 1
          fi
          if ! grep -qF "## [${WANT}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section ## [${WANT}]" >&2
            exit 1
          fi
          TAG="v${WANT}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; pick a new version or delete the tag first" >&2
            exit 1
          fi

      - name: Create and push annotated tag on main
        env:
          WANT: ${{ inputs.version }}
        run: |
          TAG="v${WANT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "ambient-core ${TAG}"
          git push origin "refs/tags/${TAG}"

  build-release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ format('v{0}', inputs.version) }}
    secrets: inherit
